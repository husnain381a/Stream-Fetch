name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes or changelog'
        required: false
        default: 'StreamFetch video downloader release build'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Attach APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore for Signing
        run: |
          mkdir -p ~/.android
          # Generate standard signing keystore if not provided in environment
          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Generating build signing key..."
            keytool -genkey -v -keystore ./my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=StreamFetch, OU=Mobile, O=AIStudio, L=Mountain View, S=CA, C=US"
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Using repository secrets for signing..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./my-upload-key.jks
            echo "KEYSTORE_PATH=$(pwd)/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          # Also ensure debug.keystore exists
          keytool -genkey -v -keystore ./debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare Local Environment File
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Build Debug APK as Fallback
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release Assets
        id: prepare_assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ "$TAG_NAME" = "main" ] || [ -z "$TAG_NAME" ]; then
            TAG_NAME="${{ github.event.inputs.version_name }}"
          fi
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.0.0"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          mkdir -p release_assets

          # Copy Release APK if generated
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/StreamFetch-${TAG_NAME}-release.apk"
          fi

          # Copy Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release_assets/StreamFetch-${TAG_NAME}-debug.apk"
          fi

          # Compute SHA-256 Checksums
          cd release_assets
          sha256sum *.apk > checksums.txt
          cd ..

          ls -la release_assets/

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_assets.outputs.TAG_NAME }}
          name: StreamFetch ${{ steps.prepare_assets.outputs.TAG_NAME }}
          body: |
            ## StreamFetch Video Downloader Release ${{ steps.prepare_assets.outputs.TAG_NAME }}
            
            ### Features:
            - **Smart Video Sniffer**: Detects HTML5 & streaming videos directly in built-in browser.
            - **Universal Link Downloader**: Fast Link download for direct MP4, WebM, and online video streams.
            - **Download Manager**: Background downloads with resume, real-time speed, and ETA.
            - **Saved Video Library**: Built-in hardware-accelerated video player with external app launcher.
            
            ### Downloads:
            Download the attached `.apk` file below directly to your Android device to install.
            
            ${{ github.event.inputs.release_notes }}
          files: |
            release_assets/*.apk
            release_assets/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
